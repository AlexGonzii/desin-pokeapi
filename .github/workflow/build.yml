name: Build EXE (PySide6 - PokeAPI)

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: powershell

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyside6 requests

          if (Test-Path "requirements.txt") {
            pip install -r requirements.txt
          }

      - name: ⚙️ Build EXE
        run: |
          pyinstaller `
            --noconfirm `
            --onefile `
            --windowed `
            --clean `
            --name pokeapi-app `
            main.py

      - name: 🔍 Check output
        run: |
          Get-ChildItem dist -Recurse

      - name: 🚀 Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokeapi-exe
          path: dist/pokeapi-app.exe